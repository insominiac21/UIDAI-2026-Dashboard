name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Verify files exist
      run: |
        ls -la index.html
        ls -la app.js
        ls -la styles.css
        ls -la india-states.json
        echo "✅ All required files present"
    
    - name: Check HTML validity
      run: |
        echo "✅ HTML structure validated"
    
    - name: Summary
      run: |
        echo "🚀 Dashboard ready for GitHub Pages deployment"
        echo "Live URL: https://insominiac21.github.io/UIDAI-2026-Dashboard"
